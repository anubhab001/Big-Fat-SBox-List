GLEEOK.S3:
  canonical_name: ["Gleeok", "S3"]
  lookup_table: [0, 5, 3, 2, 6, 1, 4, 7]
  algebraic_degree: [2, 2, 2]
  nonlinearity: 2
  differential_uniformity: 2
  absolute_linear_uniformity: 2
  boomerang_uniformity: 2
  absolute_autocorrelation_uniformity: 8
  involution: true
  order: 2
  inversion: 9
  fixed_point: [0, 7]
  year: [2024]
  cipher: true  # Used in a cipher
  differential_branch_number: 2
  linear_branch_number: 2
  origin: "Anand, Banik, Caforio, Ishikawa, Isobe, Liu, Minematsu, Rahman, Sakamoto; Gleeok: A Family of Low-Latency PRFs and its Applications to Authenticated Encryption; TCHES 2024(2); pp. 545-587; DOI: 10.46586/tches.v2024.i2.545-587"
  note: "3-bit SBox used in Branch1 of the Gleeok PRF. Gleeok's other two SBoxes reuse existing SBoxes: its 4-bit SBox (S4) equals the Orthros SBox (see ORTHROS.SSB0) and its 5-bit SBox (S5) equals the SHA-3 (Keccak chi) SBox (see SHA3) The same table as 3WAY, PRINTCIPHER up to XOR of a constant into the input and the output, so one circuit serves either once the constants are folded into the layers around it. Neither specification says so; it was established by comparing the tables."

