  # gave 69 and the specification gives 123. Both tables are permutations of
  # 0..127, so neither bijectivity nor a size check could expose the fault; what
  # exposed it was the algebraic degree, since MISTY1 S7 is cubic by design and
  # the old table measured degree 6. Every property recorded against the old
